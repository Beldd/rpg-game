<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fantasy of Arcadia — Design Tools</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      background: #0f0f17;
      color: #d4d4e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ──────────────────────────────────────────────────── */
    #topbar {
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      padding: 0 20px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    #topbar h1 {
      font-size: 15px;
      font-weight: 600;
      color: #a0a8e0;
      letter-spacing: 0.5px;
    }
    .topbar-tag {
      font-size: 11px;
      background: #2a2a4a;
      color: #6868a0;
      padding: 2px 8px;
      border-radius: 3px;
    }
    #topbar-actions { margin-left: auto; display: flex; gap: 8px; }

    /* ── Layout: left nav + main panel ───────────────────────────── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left nav ─────────────────────────────────────────────────── */
    #sidenav {
      width: 200px;
      background: #141420;
      border-right: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .nav-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4a4a70;
      padding: 16px 16px 6px;
    }
    .nav-item {
      padding: 8px 16px;
      cursor: pointer;
      color: #8888b0;
      border-left: 3px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-item:hover { background: #1e1e30; color: #c0c0e0; }
    .nav-item.active {
      background: #1e1e38;
      color: #a0a8ff;
      border-left-color: #6060cc;
    }
    .nav-item .nav-count {
      margin-left: auto;
      font-size: 11px;
      background: #2a2a4a;
      color: #6060a0;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .nav-section-divider {
      height: 1px;
      background: #2a2a4a;
      margin: 8px 0;
    }

    /* ── Main panel ───────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── List panel (middle): shows all encounters in that category ─ */
    #list-panel {
      width: 220px;
      background: #161622;
      border-right: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #list-panel-header {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #list-panel-header h2 { font-size: 13px; font-weight: 600; color: #c0c0e0; }
    #list-items { flex: 1; overflow-y: auto; }
    .list-item {
      padding: 10px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      color: #9090b8;
      transition: background 0.1s;
    }
    .list-item:hover { background: #1e1e30; color: #c0c0e0; }
    .list-item.active {
      background: #1e1e38;
      color: #a0a8ff;
      border-left-color: #6060cc;
    }
    .list-item-name { font-weight: 500; font-size: 13px; }
    .list-item-sub { font-size: 11px; color: #5a5a80; margin-top: 2px; }

    /* ── Edit panel (right): the form for the selected item ───────── */
    #edit-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }
    #edit-panel h3 {
      font-size: 16px;
      font-weight: 600;
      color: #c0c8ff;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a4a;
    }

    /* ── Form elements ────────────────────────────────────────────── */
    .form-section {
      margin-bottom: 24px;
    }
    .form-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5a5a88;
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .form-field label {
      font-size: 11px;
      color: #7070a0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-field input[type="text"],
    .form-field input[type="number"],
    .form-field textarea,
    .form-field select {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #d4d4e0;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s;
      width: 100%;
    }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      outline: none;
      border-color: #6060cc;
    }
    .form-field textarea {
      resize: vertical;
      min-height: 72px;
      line-height: 1.5;
    }
    .field-hint {
      font-size: 11px;
      color: #4a4a68;
      margin-top: 2px;
    }

    /* ── Drop pool ────────────────────────────────────────────────── */
    #drop-pool-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .drop-pool-entry {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 10px 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .drop-pool-entry .field-name { flex: 2; }
    .drop-pool-entry .field-weight { flex: 0 0 70px; }
    .drop-pool-entry .field-stackable { flex: 0 0 80px; display: flex; align-items: center; gap: 6px; }
    .drop-pool-entry .field-stackable label { text-transform: none; font-size: 12px; color: #8888b0; }

    /* ── Buttons ──────────────────────────────────────────────────── */
    .btn {
      padding: 7px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #5050cc; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #6060dd; }
    .btn-secondary { background: #2a2a4a; color: #c0c0e0; }
    .btn-secondary:hover:not(:disabled) { background: #383858; }
    .btn-danger { background: #661a1a; color: #ffaaaa; }
    .btn-danger:hover:not(:disabled) { background: #882222; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Status bar ───────────────────────────────────────────────── */
    #statusbar {
      height: 28px;
      background: #0d0d18;
      border-top: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }
    #status-msg { font-size: 12px; color: #6868a0; }
    #status-msg.success { color: #60cc88; }
    #status-msg.error { color: #cc6060; }

    /* ── Empty state ──────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #4a4a68;
      gap: 8px;
    }
    .empty-state p { font-size: 13px; }

    /* ── Separator ────────────────────────────────────────────────── */
    .section-sep {
      border: none;
      border-top: 1px solid #2a2a4a;
      margin: 20px 0;
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>Fantasy of Arcadia</h1>
  <span class="topbar-tag">Design Tools</span>
  <div id="topbar-actions">
    <button class="btn btn-secondary btn-sm" onclick="resetToDefaults()">Reset to defaults</button>
  </div>
</div>

<!-- Main layout -->
<div id="layout">

  <!-- Left nav: tool categories -->
  <nav id="sidenav">
    <div class="nav-section-label">Content</div>
    <div class="nav-item active" onclick="selectSection('encounters')" id="nav-encounters">
      ⚔️ Encounters
      <span class="nav-count" id="nav-count-encounters">0</span>
    </div>
    <div class="nav-item" onclick="selectSection('consumables')" id="nav-consumables">
      🧪 Consumables
      <span class="nav-count" id="nav-count-consumables">0</span>
    </div>
    <div class="nav-item" onclick="selectSection('equipment')" id="nav-equipment">
      🗡️ Equipment
      <span class="nav-count" id="nav-count-equipment">0</span>
    </div>
    <div class="nav-item" onclick="selectSection('characters')" id="nav-characters">
      👤 Characters
      <span class="nav-count" id="nav-count-characters">0</span>
    </div>
    <div class="nav-item" onclick="selectSection('zones')" id="nav-zones">
      🗺️ Zones
      <span class="nav-count" id="nav-count-zones">0</span>
    </div>
    <div class="nav-item disabled" style="opacity:0.4;cursor:not-allowed;" title="Coming soon">
      ✨ Abilities <span class="nav-count">—</span>
    </div>
    <div class="nav-section-divider"></div>
    <div class="nav-section-label">Debug</div>
    <div class="nav-item" onclick="viewRawData()">📋 View raw JSON</div>
  </nav>

  <!-- Main content -->
  <div id="main">

    <!-- List panel: shows all items in the selected category -->
    <div id="list-panel">
      <div id="list-panel-header">
        <h2 id="list-panel-title">Encounters</h2>
        <button class="btn btn-primary btn-sm" onclick="createNew()">+ New</button>
      </div>
      <div id="list-items">
        <!-- populated by renderList() -->
      </div>
    </div>

    <!-- Edit panel: form for the selected item -->
    <div id="edit-panel">
      <div class="empty-state" id="empty-state">
        <p>Select an encounter from the list, or create a new one.</p>
      </div>
      <div id="form-content" style="display:none;">
        <!-- populated by renderForm() -->
      </div>
    </div>

  </div>
</div>

<!-- Status bar -->
<div id="statusbar">
  <span id="status-msg">Ready.</span>
</div>

<script src="../src/editorData.js"></script>
<script>
/**
 * editor.js (inline)
 * ------------------
 * Design tool UI logic. Loads data from EditorData (localStorage),
 * renders lists and forms, and writes back on save. No Phaser, no
 * game code — purely vanilla JS operating on the shared data contract.
 */

// ── State ──────────────────────────────────────────────────────────
let activeSection = 'encounters';
let editorData = EditorData.load();
let selectedIndex = null; // index into editorData[activeSection]

// ── Boot ───────────────────────────────────────────────────────────
renderList();
updateNavCounts();

// ── Section switching ──────────────────────────────────────────────
function selectSection(section) {
  activeSection = section;
  selectedIndex = null;

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${section}`)?.classList.add('active');

  const titles = {
    encounters: '⚔️ Encounters',
    consumables: '🧪 Consumables',
    equipment: '🗡️ Equipment',
    characters: '👤 Characters',
    zones: '🗺️ Zones',
  };
  const titleEl = document.getElementById('list-panel-title');
  if (titleEl) titleEl.textContent = titles[section] || section;

  renderList();
  showEmptyState();
}

// ── List panel ─────────────────────────────────────────────────────
function renderList() {
  const container = document.getElementById('list-items');
  const items = editorData[activeSection] || [];

  updateNavCounts();

  if (items.length === 0) {
    container.innerHTML = '<div style="padding:14px;color:#4a4a68;font-size:12px;">No entries yet. Click "+ New" to create one.</div>';
    return;
  }

  container.innerHTML = items.map((item, i) => {
    let sub;
    if (activeSection === 'consumables') {
      sub = `Qty: ${item.startingQuantity} · ${item.effect ? item.effect.type : 'no effect'}`;
    } else if (activeSection === 'equipment') {
      sub = `${item.slot} · ${item.startingOwned ? 'starting item' : 'not starting'}`;
    } else if (activeSection === 'characters') {
      sub = `${(item.spells || []).length} spell${(item.spells || []).length === 1 ? '' : 's'} · HP ${item.startingHp} MP ${item.startingMp}`;
    } else if (activeSection === 'zones') {
      const enc = item.randomEncounters || [];
      sub = `${item.enabled ? '✅ enabled' : '⛔ disabled'} · ${enc.length} encounter${enc.length === 1 ? '' : 's'}`;
    } else {
      sub = `ID: ${escHtml(item.id)}`;
    }
    return `
    <div class="list-item ${selectedIndex === i ? 'active' : ''}" onclick="selectItem(${i})">
      <div class="list-item-name">${escHtml(item.name)}</div>
      <div class="list-item-sub">${sub}</div>
    </div>
  `;
  }).join('');
}

function selectItem(index) {
  selectedIndex = index;
  renderList();
  renderForm();
}

// ── Form rendering ─────────────────────────────────────────────────
function renderForm() {
  if (selectedIndex === null) { showEmptyState(); return; }

  const item = editorData[activeSection][selectedIndex];
  if (!item) { showEmptyState(); return; }

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('form-content').style.display = 'block';

  if (activeSection === 'encounters') {
    renderEncounterForm(item, selectedIndex);
  } else if (activeSection === 'zones') {
    renderZoneForm(item, selectedIndex);
  } else if (activeSection === 'consumables') {
    renderConsumableForm(item, selectedIndex);
  } else if (activeSection === 'equipment') {
    renderEquipmentForm(item, selectedIndex);
  } else if (activeSection === 'characters') {
    renderCharacterForm(item, selectedIndex);
  }
}

function renderEncounterForm(enc, index) {
  // Ensure abilities array exists for older saved data
  enc.abilities = enc.abilities || [];
  enc.mapPosition = enc.mapPosition || { tileX: 14, tileY: 9 };

  const dropPoolHtml = (enc.rewards.dropPool || []).map((entry, i) => `
    <div class="drop-pool-entry">
      <div class="form-field field-name">
        <label>Item name</label>
        <input type="text" value="${escHtml(entry.name)}"
          onchange="updateDropPoolEntry(${index}, ${i}, 'name', this.value)" />
      </div>
      <div class="form-field field-weight">
        <label>Weight</label>
        <input type="number" min="1" value="${entry.weight}"
          onchange="updateDropPoolEntry(${index}, ${i}, 'weight', +this.value)" />
      </div>
      <div class="field-stackable">
        <input type="checkbox" id="stackable-${i}" ${entry.stackable ? 'checked' : ''}
          onchange="updateDropPoolEntry(${index}, ${i}, 'stackable', this.checked)" />
        <label for="stackable-${i}">Stackable</label>
      </div>
      <button class="btn btn-danger btn-sm" onclick="removeDropPoolEntry(${index}, ${i})">✕</button>
    </div>
  `).join('');

  const ABILITY_TYPES = ['attack', 'heal', 'drain', 'debuff', 'buff'];
  const DEBUFF_STATS = ['attackMin', 'attackMax', 'defense'];

  function abilityParamsHtml(ab, i) {
    const t = ab.type || 'attack';
    const p = ab.params || {};
    const msgHint = t === 'heal'
      ? '{name} = enemy · {amount} = heal amount'
      : t === 'buff'
      ? '{name} = enemy'
      : t === 'debuff'
      ? '{name} = enemy · {target} = target'
      : '{name} = enemy · {target} = target · {damage} = damage';

    let fields = `
      <div class="form-field" style="flex:3;">
        <label>Message template</label>
        <input type="text" value="${escHtml(p.message || '')}"
          onchange="updateAbilityParam(${index}, ${i}, 'message', this.value)" />
        <span class="field-hint">${msgHint}</span>
      </div>`;

    if (t === 'attack') {
      fields = `
        <div class="form-field field-weight">
          <label>Dmg multiplier</label>
          <input type="number" min="0" step="0.05" value="${p.damageMultiplier || 1.0}"
            onchange="updateAbilityParam(${index}, ${i}, 'damageMultiplier', +this.value)" />
          <span class="field-hint">1.0 = normal</span>
        </div>` + fields;
    } else if (t === 'heal') {
      fields = `
        <div class="form-field field-weight">
          <label>Min heal</label>
          <input type="number" min="0" value="${p.minAmount || 5}"
            onchange="updateAbilityParam(${index}, ${i}, 'minAmount', +this.value)" />
        </div>
        <div class="form-field field-weight">
          <label>Max heal</label>
          <input type="number" min="0" value="${p.maxAmount || 10}"
            onchange="updateAbilityParam(${index}, ${i}, 'maxAmount', +this.value)" />
        </div>` + fields;
    } else if (t === 'drain') {
      fields = `
        <div class="form-field field-weight">
          <label>Dmg multiplier</label>
          <input type="number" min="0" step="0.05" value="${p.damageMultiplier || 1.0}"
            onchange="updateAbilityParam(${index}, ${i}, 'damageMultiplier', +this.value)" />
        </div>
        <div class="form-field field-weight">
          <label>Self heal %</label>
          <input type="number" min="0" max="1" step="0.05" value="${p.selfHealPercent || 0.2}"
            onchange="updateAbilityParam(${index}, ${i}, 'selfHealPercent', +this.value)" />
        </div>` + fields;
    } else if (t === 'debuff' || t === 'buff') {
      fields = `
        <div class="form-field field-weight">
          <label>Stat</label>
          <select onchange="updateAbilityParam(${index}, ${i}, 'stat', this.value)">
            ${DEBUFF_STATS.map(s => `<option value="${s}" ${(p.stat||'attackMin') === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="form-field field-weight">
          <label>Amount</label>
          <input type="number" min="0" value="${p.amount || 2}"
            onchange="updateAbilityParam(${index}, ${i}, 'amount', +this.value)" />
        </div>
        <div class="form-field field-weight">
          <label>Turns</label>
          <input type="number" min="1" value="${p.durationTurns || 3}"
            onchange="updateAbilityParam(${index}, ${i}, 'durationTurns', +this.value)" />
        </div>` + fields;
    }
    return fields;
  }

  const abilitiesHtml = enc.abilities.map((ab, i) => `
    <div class="drop-pool-entry" style="flex-direction:column;gap:10px;">
      <div style="display:flex;gap:12px;align-items:center;">
        <div class="form-field" style="flex:2;">
          <label>Name</label>
          <input type="text" value="${escHtml(ab.name)}"
            onchange="updateAbility(${index}, ${i}, 'name', this.value)" />
        </div>
        <div class="form-field" style="flex:1;">
          <label>Type</label>
          <select onchange="updateAbilityType(${index}, ${i}, this.value)">
            ${ABILITY_TYPES.map(t => `<option value="${t}" ${(ab.type||'attack') === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="form-field field-weight">
          <label>Weight</label>
          <input type="number" min="1" value="${ab.weight}"
            onchange="updateAbility(${index}, ${i}, 'weight', +this.value)" />
          <span class="field-hint">Relative probability</span>
        </div>
        <button class="btn btn-danger btn-sm" style="margin-top:16px;" onclick="removeAbility(${index}, ${i})">✕</button>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        ${abilityParamsHtml(ab, i)}
      </div>
    </div>
  `).join('');

  const isStatic = enc.type === 'static';

  document.getElementById('form-content').innerHTML = `
    <h3>Edit Encounter</h3>

    <div class="form-section">
      <div class="form-section-title">Identity</div>
      <div class="form-row">
        <div class="form-field">
          <label>ID</label>
          <input type="text" value="${escHtml(enc.id)}"
            onchange="updateField(${index}, 'id', this.value)" />
          <span class="field-hint">Stable identifier used by the game. Changing this breaks existing map references.</span>
        </div>
        <div class="form-field">
          <label>Display name</label>
          <input type="text" value="${escHtml(enc.name)}"
            onchange="updateField(${index}, 'name', this.value)" />
        </div>
        <div class="form-field" style="max-width:140px;">
          <label>Type</label>
          <select onchange="updateEncounterType(${index}, this.value)">
            <option value="static" ${isStatic ? 'selected' : ''}>Static</option>
            <option value="random" ${!isStatic ? 'selected' : ''}>Random</option>
          </select>
        </div>
      </div>
      ${isStatic ? `
      <div class="form-row" id="map-position-row">
        <div class="form-field" style="max-width:120px;">
          <label>Map tile X</label>
          <input type="number" min="0" value="${enc.mapPosition.tileX}"
            onchange="updateMapPosition(${index}, 'tileX', +this.value)" />
        </div>
        <div class="form-field" style="max-width:120px;">
          <label>Map tile Y</label>
          <input type="number" min="0" value="${enc.mapPosition.tileY}"
            onchange="updateMapPosition(${index}, 'tileY', +this.value)" />
        </div>
        <div class="form-field" style="justify-content:flex-end;padding-top:20px;">
          <span class="field-hint">Tile coordinates on the overworld map</span>
        </div>
      </div>
      <div class="form-row" id="dungeon-position-row">
        <div class="form-field" style="max-width:120px;">
          <label>Dungeon tile X</label>
          <input type="number" min="0" value="${(enc.dungeonPosition || {}).tileX || 14}"
            onchange="updateDungeonPosition(${index}, 'tileX', +this.value)" />
        </div>
        <div class="form-field" style="max-width:120px;">
          <label>Dungeon tile Y</label>
          <input type="number" min="0" value="${(enc.dungeonPosition || {}).tileY || 9}"
            onchange="updateDungeonPosition(${index}, 'tileY', +this.value)" />
        </div>
        <div class="form-field" style="justify-content:flex-end;padding-top:20px;">
          <span class="field-hint">Tile coordinates inside the dungeon (leave 0,0 if not used there)</span>
        </div>
      </div>` : `
      <div class="form-row">
        <span class="field-hint" style="padding:8px 0;">Random encounters have no fixed map position — trigger logic is defined separately.</span>
      </div>`}
    </div>

    <div class="form-section">
      <div class="form-section-title">Stats</div>
      <div class="form-row">

// ── Field update helpers ───────────────────────────────────────────
// These update in-memory data immediately; changes are persisted
// to localStorage only when "Save changes" is clicked, not on every
// keystroke — this avoids spamming localStorage and gives the user
// a moment to review before committing.

function updateField(index, field, value) {
  editorData[activeSection][index][field] = value;
  markDirty();
}

function updateEncounterType(index, value) {
  editorData[activeSection][index].type = value;
  if (value === 'random') {
    editorData[activeSection][index].mapPosition = null;
  } else if (!editorData[activeSection][index].mapPosition) {
    editorData[activeSection][index].mapPosition = { tileX: 14, tileY: 9 };
  }
  markDirty();
  renderForm(); // re-render to show/hide mapPosition row
}

function updateMapPosition(index, axis, value) {
  if (!editorData[activeSection][index].mapPosition) {
    editorData[activeSection][index].mapPosition = { tileX: 14, tileY: 9 };
  }
  editorData[activeSection][index].mapPosition[axis] = value;
  markDirty();
}

function updateDungeonPosition(index, axis, value) {
  if (!editorData[activeSection][index].dungeonPosition) {
    editorData[activeSection][index].dungeonPosition = { tileX: 14, tileY: 9 };
  }
  editorData[activeSection][index].dungeonPosition[axis] = value;
  markDirty();
}

function updateAbility(encIndex, abilityIndex, field, value) {
  editorData[activeSection][encIndex].abilities[abilityIndex][field] = value;
  markDirty();
}

function updateAbilityType(encIndex, abilityIndex, newType) {
  const ab = editorData[activeSection][encIndex].abilities[abilityIndex];
  ab.type = newType;
  // Reset params to sensible defaults for the new type.
  if (newType === 'attack') ab.params = { damageMultiplier: 1.0, message: '{name} attacks {target} for {damage} damage!' };
  else if (newType === 'heal') ab.params = { minAmount: 5, maxAmount: 10, message: '{name} heals for {amount} HP!' };
  else if (newType === 'drain') ab.params = { damageMultiplier: 1.0, selfHealPercent: 0.2, message: '{name} drains {target} for {damage} damage!' };
  else if (newType === 'debuff') ab.params = { stat: 'attackMin', amount: 2, durationTurns: 3, message: '{name} weakens {target}!' };
  else if (newType === 'buff') ab.params = { stat: 'attackMin', amount: 2, durationTurns: 3, message: '{name} enrages!' };
  markDirty();
  renderForm();
}

function updateAbilityParam(encIndex, abilityIndex, param, value) {
  editorData[activeSection][encIndex].abilities[abilityIndex].params[param] = value;
  markDirty();
}

function addAbility(encIndex) {
  editorData[activeSection][encIndex].abilities.push({
    id: `ability_${Date.now()}`,
    name: 'Attack',
    type: 'attack',
    weight: 50,
    params: {
      damageMultiplier: 1.0,
      message: '{name} attacks {target} for {damage} damage!',
    },
  });
  markDirty();
  renderForm();
}

function removeAbility(encIndex, abilityIndex) {
  editorData[activeSection][encIndex].abilities.splice(abilityIndex, 1);
  markDirty();
  renderForm();
}

function updateStat(index, stat, value) {
  editorData[activeSection][index].stats[stat] = value;
  markDirty();
}

function updateDialogue(index, key, value) {
  editorData[activeSection][index].dialogue[key] = value;
  markDirty();
}

function updateReward(index, key, value) {
  editorData[activeSection][index].rewards[key] = value;
  markDirty();
}

function updateDropPoolEntry(encIndex, poolIndex, field, value) {
  editorData[activeSection][encIndex].rewards.dropPool[poolIndex][field] = value;
  markDirty();
}

function addDropPoolEntry(encIndex) {
  editorData[activeSection][encIndex].rewards.dropPool.push({
    name: 'Potion', stackable: true, weight: 1,
  });
  markDirty();
  renderForm();
}

function removeDropPoolEntry(encIndex, poolIndex) {
  editorData[activeSection][encIndex].rewards.dropPool.splice(poolIndex, 1);
  markDirty();
  renderForm();
}

// ── Create / Delete ────────────────────────────────────────────────
function renderCharacterForm(char, index) {
  char.spells = char.spells || [];

  const SPELL_TYPES = ['offense', 'heal', 'drain', 'debuff', 'attackMultiplier'];

  function spellParamsHtml(spell, si) {
    const t = spell.type;
    let fields = '';
    if (t === 'offense' || t === 'heal') {
      fields = `
        <div class="form-field field-weight"><label>Min</label>
          <input type="number" min="0" value="${spell.min || 0}"
            onchange="updateSpellParam(${index}, ${si}, 'min', +this.value)" /></div>
        <div class="form-field field-weight"><label>Max</label>
          <input type="number" min="0" value="${spell.max || 0}"
            onchange="updateSpellParam(${index}, ${si}, 'max', +this.value)" /></div>`;
    } else if (t === 'drain') {
      fields = `
        <div class="form-field field-weight"><label>Multiplier</label>
          <input type="number" min="0" step="0.05" value="${spell.multiplier || 1.0}"
            onchange="updateSpellParam(${index}, ${si}, 'multiplier', +this.value)" /></div>
        <div class="form-field field-weight"><label>Self heal %</label>
          <input type="number" min="0" max="1" step="0.05" value="${spell.selfHealPercent || 0}"
            onchange="updateSpellParam(${index}, ${si}, 'selfHealPercent', +this.value)" /></div>`;
    } else if (t === 'attackMultiplier') {
      fields = `
        <div class="form-field field-weight"><label>Multiplier</label>
          <input type="number" min="0" step="0.05" value="${spell.multiplier || 1.0}"
            onchange="updateSpellParam(${index}, ${si}, 'multiplier', +this.value)" /></div>`;
    } else if (t === 'debuff') {
      fields = `
        <div class="form-field field-weight"><label>Duration (turns)</label>
          <input type="number" min="1" value="${spell.durationTurns || 3}"
            onchange="updateSpellParam(${index}, ${si}, 'durationTurns', +this.value)" /></div>`;
    }
    return fields;
  }

  const spellsHtml = char.spells.map((spell, si) => `
    <div class="drop-pool-entry" style="flex-direction:column;gap:10px;">
      <div style="display:flex;gap:12px;align-items:flex-end;">
        <div class="form-field" style="flex:2;">

        </div>
        <div class="form-field" style="flex:1;">
          <label>Type</label>
          <select onchange="updateSpellType(${index}, ${si}, this.value)">
            ${SPELL_TYPES.map(t => `<option value="${t}" ${spell.type === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="form-field field-weight">
          <label>MP cost</label>
          <input type="number" min="0" value="${spell.cost || 0}"
            onchange="updateSpell(${index}, ${si}, 'cost', +this.value)" />
        </div>
        <button class="btn btn-danger btn-sm" style="margin-bottom:2px;" onclick="removeSpell(${index}, ${si})">✕</button>
      </div>
      <div style="display:flex;gap:12px;">
        ${spellParamsHtml(spell, si)}
      </div>
    </div>
  `).join('');

  document.getElementById('form-content').innerHTML = `
    <h3>Edit Character</h3>

    <div class="form-section">
      <div class="form-section-title">Identity</div>
      <div class="form-row">
        <div class="form-field">
          <label>ID</label>
          <input type="text" value="${escHtml(char.id)}"
            onchange="updateField(${index}, 'id', this.value)" />
          <span class="field-hint">Stable identifier. Changing this breaks save file references.</span>
        </div>
        <div class="form-field">
          <label>Display name</label>
          <input type="text" value="${escHtml(char.name)}"
            onchange="updateField(${index}, 'name', this.value)" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Starting stats</div>
      <div class="form-row">
        <div class="form-field">
          <label>Max HP</label>
          <input type="number" min="1" value="${char.startingHp}"
            onchange="updateField(${index}, 'startingHp', +this.value)" />
        </div>
        <div class="form-field">
          <label>Max MP</label>
          <input type="number" min="0" value="${char.startingMp}"
            onchange="updateField(${index}, 'startingMp', +this.value)" />
        </div>
        <div class="form-field">
          <label>Attack min</label>
          <input type="number" min="0" value="${char.baseStats.attackMin}"
            onchange="updateCharStat(${index}, 'attackMin', +this.value)" />
        </div>
        <div class="form-field">
          <label>Attack max</label>
          <input type="number" min="0" value="${char.baseStats.attackMax}"
            onchange="updateCharStat(${index}, 'attackMax', +this.value)" />
        </div>
        <div class="form-field">
          <label>Defense</label>
          <input type="number" min="0" value="${char.baseStats.defense}"
            onchange="updateCharStat(${index}, 'defense', +this.value)" />

        <div class="form-field">
          <label>Speed</label>
          <input type="number" min="0" value="${char.baseStats.speed || 10}"

    </div>

    <hr class="section-sep">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="saveAll()">Save changes</button>

    </div>

}

function updateCharStat(charIndex, stat, value) {
  editorData[activeSection][charIndex].baseStats[stat] = value;
  markDirty();
}

function updateSpell(charIndex, spellIndex, field, value) {
  editorData[activeSection][charIndex].spells[spellIndex][field] = value;
  markDirty();
}

function updateSpellType(charIndex, spellIndex, newType) {
  const spell = editorData[activeSection][charIndex].spells[spellIndex];
  // Clear old type-specific params before applying the new type's defaults.
  const base = { id: spell.id, name: spell.name, cost: spell.cost, type: newType };
  if (newType === 'offense' || newType === 'heal') {
    editorData[activeSection][charIndex].spells[spellIndex] = { ...base, min: 8, max: 14 };
  } else if (newType === 'drain') {
    editorData[activeSection][charIndex].spells[spellIndex] = { ...base, multiplier: 1.25, selfHealPercent: 0.2 };
  } else if (newType === 'attackMultiplier') {
    editorData[activeSection][charIndex].spells[spellIndex] = { ...base, multiplier: 2.0 };
  } else if (newType === 'debuff') {
    editorData[activeSection][charIndex].spells[spellIndex] = { ...base, durationTurns: 3 };
  }
  markDirty();
  renderForm(); // re-render to show the new type's param fields
}

function updateSpellParam(charIndex, spellIndex, param, value) {
  editorData[activeSection][charIndex].spells[spellIndex][param] = value;
  markDirty();
}

function addSpell(charIndex) {
  editorData[activeSection][charIndex].spells.push({
    id: `spell_${Date.now()}`,
    name: 'New Spell',
    cost: 5,
    type: 'offense',
    min: 8,

  });

  renderForm();
}

function removeSpell(charIndex, spellIndex) {
  editorData[activeSection][charIndex].spells.splice(spellIndex, 1);
  markDirty();
  renderForm();
}

function updateBonusEntry(eqIndex, bonusIndex, field, value) {
  editorData[activeSection][eqIndex].bonus[bonusIndex][field] = value;
  markDirty();
}

function addBonusEntry(eqIndex) {
  editorData[activeSection][eqIndex].bonus.push({ stat: 'defense', amount: 1 });
  markDirty();
  renderForm();
}

function removeBonusEntry(eqIndex, bonusIndex) {
  editorData[activeSection][eqIndex].bonus.splice(bonusIndex, 1);
  markDirty();
  renderForm();
}

function updateConsumableEffect(index, field, value) {
  if (!editorData[activeSection][index].effect) return;
  editorData[activeSection][index].effect[field] = value;
  markDirty();
}

function createNew() {
  let newItem;
  if (activeSection === 'encounters') {
    newItem = {
      id: `encounter_${Date.now()}`,
      name: 'New Encounter',
      type: 'static',
      mapPosition: { tileX: 5, tileY: 5 },
      stats: { hp: 20, attackMin: 2, attackMax: 6, xpReward: 10 },
      abilities: [
        {
          id: 'basic_attack',
          name: 'Attack',
          type: 'attack',
          weight: 100,
          params: {
            damageMultiplier: 1.0,
            message: '{name} attacks {target} for {damage} damage!',
          },
        },
      ],
      rewards: { dropPool: [], dropChance: 0.5 },
      dialogue: { challenge: "Halt, {interlopers}! I am {name}, and I will not let you pass!" },
    };
  } else if (activeSection === 'consumables') {
    newItem = {
      id: `consumable_${Date.now()}`,
      name: 'New Item',
      type: 'consumable',
      effect: { type: 'heal', minAmount: 10, maxAmount: 20 },
      startingQuantity: 0,
    };
  } else if (activeSection === 'equipment') {
    newItem = {
      id: `equipment_${Date.now()}`,
      name: 'New Item',
      slot: 'primary',
      startingOwned: false,
      bonus: [{ stat: 'attackMin', amount: 1 }, { stat: 'attackMax', amount: 1 }],
    };
  } else if (activeSection === 'characters') {
    newItem = {
      id: `character_${Date.now()}`,
      name: 'New Character',
      startingHp: 20,
      startingMp: 10,
      baseStats: { attackMin: 3, attackMax: 6, defense: 0 },
      spells: [],
    };
  } else if (activeSection === 'zones') {
    newItem = {
      id: `zone_${Date.now()}`,
      name: 'New Zone',
      enabled: false,
      randomEncounters: [],
    };
  } else {
    return;
  }

  editorData[activeSection] = editorData[activeSection] || [];
  editorData[activeSection].push(newItem);
  selectedIndex = editorData[activeSection].length - 1;
  saveAll();
  renderList();
  renderForm();
}

function deleteItem(index) {
  if (!confirm(`Delete "${editorData[activeSection][index].name}"? This cannot be undone.`)) return;
  editorData[activeSection].splice(index, 1);
  selectedIndex = null;
  saveAll();
  renderList();
  showEmptyState();
}

// ── Persistence ────────────────────────────────────────────────────
let isDirty = false;
function markDirty() {
  isDirty = true;
  setStatus('Unsaved changes.', '');
}

function saveAll() {
  const ok = EditorData.save(editorData);
  isDirty = false;
  if (ok) {
    setStatus('Saved. Refresh the game to apply changes.', 'success');
    renderList(); // update counts
  } else {
    setStatus('Save failed — localStorage may be unavailable.', 'error');
  }
}

function resetToDefaults() {
  if (!confirm('Reset ALL editor data to defaults? This will discard every custom encounter, item, and ability.')) return;
  EditorData.reset();
  editorData = EditorData.load();
  selectedIndex = null;
  renderList();
  showEmptyState();
  setStatus('Reset to defaults.', 'success');
}

// ── Debug: raw JSON viewer ─────────────────────────────────────────
function viewRawData() {
  selectedIndex = null;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('form-content').style.display = 'block';
  document.getElementById('form-content').innerHTML = `
    <h3>Raw JSON data</h3>
    <div class="form-field">
      <textarea style="font-family:monospace;font-size:12px;min-height:400px;">${escHtml(JSON.stringify(editorData, null, 2))}</textarea>
    </div>
    <p class="field-hint" style="margin-top:8px;">Read-only view. Use the form panels to edit values.</p>
  `;
}

// ── Utilities ──────────────────────────────────────────────────────

function renderConsumableForm(con, index) {
  const hasEffect = con.effect !== null && con.effect !== undefined;

  document.getElementById('form-content').innerHTML = `
    <h3>Edit Consumable</h3>

    <div class="form-section">
      <div class="form-section-title">Identity</div>
      <div class="form-row">
        <div class="form-field">
          <label>ID</label>
          <input type="text" value="${escHtml(con.id)}"
            onchange="updateField(${index}, 'id', this.value)" />
          <span class="field-hint">Stable identifier. Changing this may break references.</span>
        </div>
        <div class="form-field">
          <label>Display name</label>
          <input type="text" value="${escHtml(con.name)}"
            onchange="updateField(${index}, 'name', this.value)" />
        </div>
        <div class="form-field" style="max-width:140px;">
          <label>Starting quantity</label>
          <input type="number" min="0" value="${con.startingQuantity}"
            onchange="updateField(${index}, 'startingQuantity', +this.value)" />
          <span class="field-hint">0 = in catalog, not given to player</span>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Effect</div>
      <div class="form-row" style="align-items:center;gap:12px;margin-bottom:14px;">
        <label style="font-size:13px;color:#8888b0;">Has effect?</label>
        <input type="checkbox" ${hasEffect ? 'checked' : ''}
          onchange="toggleConsumableEffect(${index}, this.checked)" />
        <span class="field-hint">${hasEffect ? '' : 'No effect wired yet (e.g. Antidote awaiting status system)'}</span>
      </div>
      ${hasEffect ? `
      <div class="form-row">
        <div class="form-field" style="max-width:180px;">
          <label>Effect type</label>
          <select onchange="updateConsumableEffect(${index}, 'type', this.value)">
            <option value="heal" ${con.effect.type === 'heal' ? 'selected' : ''}>Heal HP</option>
          </select>
        </div>
        <div class="form-field" style="max-width:120px;">
          <label>Min amount</label>
          <input type="number" min="0" value="${con.effect.minAmount}"
            onchange="updateConsumableEffect(${index}, 'minAmount', +this.value)" />
        </div>
        <div class="form-field" style="max-width:120px;">
          <label>Max amount</label>
          <input type="number" min="0" value="${con.effect.maxAmount}"
            onchange="updateConsumableEffect(${index}, 'maxAmount', +this.value)" />
        </div>
      </div>` : ''}
    </div>

    <hr class="section-sep">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="saveAll()">Save changes</button>
      <button class="btn btn-danger" onclick="deleteItem(${index})">Delete consumable</button>
    </div>
  `;
}

// ── Zone form ──────────────────────────────────────────────────────
function renderZoneForm(zone, index) {
  // Build a checkbox list of all known encounter IDs so the designer
  // can tick which ones appear in this zone's random encounter table.
  const allEncounters = editorData.encounters || [];
  const selected = new Set(zone.randomEncounters || []);

  const encounterCheckboxes = allEncounters.length === 0
    ? '<div style="color:#4a4a68;font-size:12px;padding:8px 0;">No encounters defined yet. Create some in ⚔️ Encounters first.</div>'
    : allEncounters.map(enc => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <input type="checkbox" id="zone-enc-${escHtml(enc.id)}"
            ${selected.has(enc.id) ? 'checked' : ''}
            onchange="toggleZoneEncounter(${index}, '${escHtml(enc.id)}', this.checked)" />
          <label for="zone-enc-${escHtml(enc.id)}" style="font-size:13px;cursor:pointer;">
            ${escHtml(enc.name)}
            <span style="color:#4a4a68;font-size:11px;margin-left:4px;">(${escHtml(enc.id)})</span>
          </label>
        </div>`).join('');

  document.getElementById('form-content').innerHTML = `
    <h3>Edit Zone</h3>

    <div class="form-section">
      <div class="form-section-title">Identity</div>
      <div class="form-row">
        <div class="form-field">
          <label>ID</label>
          <input type="text" value="${escHtml(zone.id)}"
            onchange="updateField(${index}, 'id', this.value)" />
          <span class="field-hint">Stable key used by the game (e.g. "town", "overworld", "dungeon"). Changing this breaks the game's zone lookup.</span>
        </div>
        <div class="form-field">
          <label>Display name</label>
          <input type="text" value="${escHtml(zone.name)}"
            onchange="updateField(${index}, 'name', this.value)" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Random Encounters</div>
      <div class="form-row" style="align-items:center;gap:12px;margin-bottom:14px;">
        <label style="font-size:13px;color:#8888b0;">Encounters enabled?</label>
        <input type="checkbox" id="zone-enabled-${index}" ${zone.enabled ? 'checked' : ''}
          onchange="updateZoneEnabled(${index}, this.checked)" />
        <span class="field-hint">${zone.enabled ? 'Random encounters trigger in this zone.' : 'No encounters trigger — safe zone.'}</span>
      </div>
      <div class="form-section-title" style="margin-top:8px;">Encounter table</div>
      <div class="field-hint" style="margin-bottom:10px;">Check each encounter that can appear in this zone. The game picks one at random from this list when an encounter triggers.</div>
      <div id="zone-encounter-list">${encounterCheckboxes}</div>
    </div>

    <hr class="section-sep">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="saveAll()">Save changes</button>
      <button class="btn btn-danger" onclick="deleteItem(${index})">Delete zone</button>
    </div>
  `;
}

function updateZoneEnabled(index, value) {
  editorData.zones[index].enabled = value;
  markDirty();
}

function toggleZoneEncounter(index, encId, checked) {
  const zone = editorData.zones[index];
  zone.randomEncounters = zone.randomEncounters || [];
  if (checked) {
    if (!zone.randomEncounters.includes(encId)) {
      zone.randomEncounters.push(encId);
    }
  } else {
    zone.randomEncounters = zone.randomEncounters.filter(id => id !== encId);
  }
  markDirty();
  // Re-render the list panel subtitle to reflect the new count.
  renderList();
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>

</body>
</html>
